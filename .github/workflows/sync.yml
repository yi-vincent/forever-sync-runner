name: Sync data

# 本仓库是公开的，只放这一个 workflow；同步脚本与数据全在私有仓库（vars.CONTENT_REPO）。
# 运行时用 CONTENT_REPO_TOKEN checkout 私有仓库 main → 跑 scripts/sync-*.js（Forever 与经典 60 两个版本）→ 与 main 比出差异 →
# 推 bot/data-sync 分支并开（或更新）PR → 等私有仓库的 ci.yml 在 PR 上跑完 → 合并 → 升补丁版本、推 release-v* tag。
# tag 由 PAT 推送，会正常触发私有仓库的 deploy.yml（先跑一遍 CI，再构建镜像部署）。
#
# 公开仓库的日志与 artifact 谁都能看，所以：
#   - 同步脚本、git、gh 的输出一律重定向到 $PRIV（runner 临时目录），日志里只写通过 / 失败 / 有无变化，
#     外加每一项的用时、退出码和失败类型（HTTP 状态码 / 超时 / 网络错误码）——不含 URL、不含数据；
#   - 变更报告只写进私有仓库的 PR 正文，不进 step summary；
#   - artifact 用 ARTIFACT_PASSPHRASE 加密后才上传，没配口令就不上传；
#   - 结果推飞书卡片（secrets.FEISHU_WEBHOOK，开了签名校验再配 FEISHU_SIGN_SECRET）：失败项附原因与日志末尾、CI 没过附 CI 报错；
#     更新合并发版后由私有仓库 deploy.yml 推「已上线」。卡片由私有仓库 scripts/notify-feishu.js 拼，消息内容不进公开日志；
#   - 文件名、PR 号之类不写进 $GITHUB_ENV（那里的变量会在后续每个步骤开头打印到日志）；
#   - 只允许 schedule / workflow_dispatch 触发，不接任何 PR 事件（fork 拿不到 secrets，也碰不到这里）。
#
# 每一项同步都软失败：出错只跳过这一项、沿用现有数据，在 PR 报告里注明并推飞书，后面的项和开 PR / 合并 / 发版照常走。
# 两个版本：Forever（data/forever、src/data/forever）先跑；经典 60（--edition classic → data/classic、src/data/classic）
# 排在后面。两个版本共用的：public/icons、public/assets/dungeons、
# data/dungeons（首领坐标，等两个版本的副本掉落都跑完再对位）、data/quests。
#
# 不是每一项每次都全量拉（手动运行勾选「全量」时例外，一律照跑）：
#   · 任务、首领坐标：脚本先算上游指纹，与产物 meta.input 相同就跳过。
#   · Forever 的装备 / 物品 / 天赋 / 传承（Wowhead 数据页）：先看数据页上的客户端 build（scripts/check-wowhead-build.js），
#     变了立刻跑；没变时每天（UTC 日期）至少全量跑一次 —— Wowhead 改数据不一定升 build，不能只看它。
#     四项全部成功才记为今天跑过，有一项失败下一轮四项照跑。
#   · Forever 的副本掉落（几百个页面，耗时大头）：每天跑一次。
#   · 经典 60 已经稳定，只按版本号同步：Wowhead 经典数据版本与 wago 经典客户端 build（wow_classic_era）
#     任意一个变了，五项（装备 / 物品 / 天赋 / 专业 / 副本掉落）一起跑；都没变就全部跳过 —— 有依据地跑，不按日期猜。
#     两个号记在私有仓库的 data/classic/upstream.json（scripts/check-wowhead-build.js --with-wago / --stamp），
#     五项全部成功才更新记录，随 PR 合并进 main；没合并时 main 上还是旧号，下一轮照样重试。
#   「今天跑过了」记在本仓库的 actions 缓存里（.cache/sync-marks/<项>，按日期换 key）。一项跑完没产生改动、或改动已经
#   合并，才记为跑过；改动还在没合并的 PR 里时不记，下次照跑，免得 PR 被后面的同步覆盖掉这部分改动。
#   专业、职业改动没有可靠的变化信号，仍然每次都跑。
#   · 补丁说明（Forever Beta 逐 build 对比 + 服务端热修）每次都调，但脚本自己增量：没有新 build、热修缓存的
#     Last-Modified 也没变就直接收工，一张表都不下载；有新 build 只算新的一对。不传 --force（全量运行也不传）：
#     客户端 build 的表不会变，--force 只会把整段窗口重新下载重算一遍（约 120MB），换不来任何东西。
#
# 解密 artifact：
#   openssl enc -d -aes-256-cbc -md sha256 -pbkdf2 -iter 200000 -pass env:PASS -in run-N.tar.gz.enc | tar xzf -

on:
  schedule:
    # 全部上游：每五小时一次（UTC 0/5/10/15/20 点）。
    - cron: "0 */5 * * *"
    # 服务端热修（Raidbots 汇总的客户端缓存，每两小时更新）：隔两小时只跑这一项。错开整点，避开 Raidbots 自己的更新时刻。
    - cron: "40 */2 * * *"
    # 保活：公开仓库 60 天没有提交，GitHub 会停掉全部 schedule。每月 1 号提交一次 .keepalive。
    - cron: "17 3 1 * *"
  workflow_dispatch:
    inputs:
      hotfix_only:
        description: 只同步服务端热修（同两小时那条 cron）
        type: boolean
        default: false
      release:
        description: 数据有更新且 CI 通过时，自动合并、发版并部署
        type: boolean
        default: true
      full:
        description: 全量：忽略「今天已跑过」与上游指纹，每一项都照跑
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: sync-data
  cancel-in-progress: false

env:
  CONTENT_REPO: ${{ vars.CONTENT_REPO }}
  HOTFIX_ONLY: ${{ github.event.schedule == '40 */2 * * *' || (github.event_name == 'workflow_dispatch' && inputs.hotfix_only) }}
  RELEASE: ${{ github.event_name == 'schedule' || inputs.release }}
  FULL: ${{ github.event_name == 'workflow_dispatch' && inputs.full }}
  SYNC_BRANCH: bot/data-sync

jobs:
  sync:
    if: github.event.schedule != '17 3 1 * *'
    runs-on: ubuntu-latest
    # Forever 全量平时 40 分钟上下（大头是副本掉落那三百来个 Wowhead 页面），经典 60 跟在后面再跑一轮；
    # 平时大多数项按 build / 每天一次跳过。后面还要等私有仓库的 CI。
    timeout-minutes: 150
    outputs:
      merged: ${{ steps.merge.outputs.merged }}
    steps:
      - name: Preflight
        env:
          TOKEN: ${{ secrets.CONTENT_REPO_TOKEN }}
        run: |
          set -euo pipefail
          miss=""
          [ -n "${CONTENT_REPO}" ] || miss="$miss vars.CONTENT_REPO"
          [ -n "${TOKEN}" ] || miss="$miss secrets.CONTENT_REPO_TOKEN"
          if [ -n "$miss" ]; then
            echo "::error::缺少配置：$miss（Settings → Secrets and variables → Actions）"
            exit 1
          fi
          PRIV="${RUNNER_TEMP}/private"
          mkdir -p "$PRIV"
          date +%s > "$PRIV/t0"   # 飞书卡片里的用时
          echo "PRIV=${PRIV}" >> "$GITHUB_ENV"
          echo "热修模式：${HOTFIX_ONLY}；自动发版：${RELEASE}"

      - name: Checkout content repo
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.CONTENT_REPO }}
          token: ${{ secrets.CONTENT_REPO_TOKEN }}
          ref: main
          # 不把 token 留在 .git/config 里：同步脚本在这个目录里跑，推送时再临时带上
          persist-credentials: false

      # 同步脚本只用 Node 内置模块，不用装依赖。
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 副本掉落里经典旧世的页面（三百多个地区页 / 首领页）早已定型，按周缓存：一周里只有第一次全量同步真去拉。
      # 不设 restore-keys：换周就是新 key、从空目录开始。只跑热修时不碰这份缓存。
      # 公开仓库的 Actions cache 只有本仓库的 workflow 读得到，外人下载不了。
      # 经典 60 的副本掉落用的就是这批经典旧世页面（同名同址），一并读写这份缓存。
      - name: Week and day keys
        id: week
        if: env.HOTFIX_ONLY != 'true'
        run: |
          echo "key=zone-loot-classic-$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
          echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Restore classic page cache
        id: classic_cache
        if: env.HOTFIX_ONLY != 'true'
        uses: actions/cache/restore@v4
        with:
          path: .cache/zone-loot-classic
          key: ${{ steps.week.outputs.key }}

      # 「今天已跑过」的标记：每次运行都另存一份新 key（带 run_id），restore-keys 取当天最近的那份。
      - name: Restore sync marks
        if: env.HOTFIX_ONLY != 'true'
        uses: actions/cache/restore@v4
        with:
          path: .cache/sync-marks
          key: sync-marks-${{ steps.week.outputs.day }}-${{ github.run_id }}
          restore-keys: sync-marks-${{ steps.week.outputs.day }}-

      - name: Pull upstream data
        id: pull
        run: |
          # 不用 -e：GitHub 默认用 bash -e 跑，step 失败时 return 1 会让整步退出，后面的项、开 PR、发版全被跳过
          # （2026-10-07 run #33：职业改动被 CloudFront 403，副本掉落跑了 20 分钟的结果也没进 PR）。
          # 每一项失败只跳过它自己，由 step 记下来；这一步本身始终成功退出。
          set +e -uo pipefail
          REPORT="$PRIV/report.md"
          LOG="$PRIV/sync.log"
          ITEMS="$PRIV/items"       # 每一项单独一份完整输出
          FAILS="$PRIV/failures"    # 每个失败项一份：项名、原因、说明、日志末尾 → Notify Feishu 推送
          mkdir -p "$ITEMS" "$FAILS"
          : > "$REPORT"
          # 命令一列给 report-sync-status.js 认数据源（哪个同步脚本、哪个版本），只进私有目录
          printf '项\t退出码\t秒\t开始（UTC）\t命令\n' > "$PRIV/timeline.tsv"
          N=0
          FAILED=""
          fmt_dur() { if [ "$1" -ge 60 ]; then printf '%dm%02ds' $(($1 / 60)) $(($1 % 60)); else printf '%ds' "$1"; fi; }
          # 失败类型：只取状态码 / 错误码这类不含数据的信息，能进公开日志
          why_failed() {
            local code
            [ "$1" -eq 124 ] && { echo "超时"; return; }
            code="$(grep -oE 'HTTP [0-9]{3}|E(CONNRESET|TIMEDOUT|NOTFOUND|AI_AGAIN|CONNREFUSED|PIPE)' "$2" | tail -n 1)"
            echo "退出码 $1${code:+，$code}"
          }
          # 跑一项：输出进 $ITEMS/NN.log 并追加到 $LOG；公开日志只写通过 / 失败、用时和失败类型。
          # 失败的项在报告里注明、沿用现有数据，返回非 0 只给调用处判断（&& done_mark / || CLASSIC_OK=false），不中断流程。
          step() {
            local name="$1" note="$2"; shift 2
            local id out t0 start rc dur why
            N=$((N + 1)); id="$(printf '%02d' "$N")"; out="$ITEMS/$id.log"
            t0=$SECONDS; start="$(date -u +%FT%TZ)"
            { echo "===== [$id] $name  $start"; echo "\$ $*"; } >> "$LOG"
            "$@" > "$out" 2>&1
            rc=$?
            dur=$((SECONDS - t0))
            cat "$out" >> "$LOG"
            echo "===== [$id] $name 结束：退出码 $rc，用时 $(fmt_dur "$dur")" >> "$LOG"
            printf '%s\t%s\t%s\t%s\t%s\n' "$name" "$rc" "$dur" "$start" "$*" >> "$PRIV/timeline.tsv"
            if [ "$rc" -eq 0 ]; then
              echo "✓ $name（$(fmt_dur "$dur")）"
              return 0
            fi
            why="$(why_failed "$rc" "$out")"
            echo "::warning::$name 失败，本次跳过（${why}，用时 $(fmt_dur "$dur")；详情在加密 artifact 和飞书里）"
            printf '### %s\n\n- ⚠ %s\n\n' "$name" "$note" >> "$REPORT"
            { echo "✗ $name（${why}，用时 $(fmt_dur "$dur")，开始于 $start）"
              echo "$note"
              echo "--- 日志末尾 ---"
              tail -n 40 "$out"
            } > "$FAILS/$id.txt"
            FAILED="${FAILED:+$FAILED、}$name"
            return "$rc"
          }
          step "服务端热修" "同步失败（Raidbots 缓存不可用），本次跳过，沿用现有数据。" \
            node scripts/sync-hotfix-items.js --report "$REPORT"
          if [ "$HOTFIX_ONLY" != "true" ]; then
            # ---- 「今天已跑过」与指纹的辅助函数 ----
            MARKS=.cache/sync-marks
            mkdir -p "$MARKS"
            : > "$PRIV/pending-marks"
            FORCE=""
            [ "$FULL" = "true" ] && FORCE="--force"
            # 这一项今天要不要跑：全量运行、或今天还没记过
            due() { [ "$FULL" = "true" ] || [ ! -e "$MARKS/$1" ]; }
            # 工作区里数据产物的快照（已跟踪文件的 diff + 新文件的内容哈希），比较一项跑前跑后有没有改动
            snap() {
              { git diff HEAD --binary -- data src/data public/icons public/assets/dungeons
                git ls-files -o --exclude-standard -- data src/data public/icons public/assets/dungeons \
                  | while read -r f; do echo "$f $(git hash-object "$f")"; done
              } | sha1sum
            }
            # 一项跑成功之后：没改动就立刻记为跑过；有改动等合并后再记（见 Record sync marks）
            done_mark() { if [ "$2" = "$(snap)" ]; then touch "$MARKS/$1"; else echo "$1" >> "$PRIV/pending-marks"; fi; }
            skipped() { echo "- $1：跳过"; printf '### %s\n\n- %s\n\n' "$1" "$2" >> "$REPORT"; }
            # Wowhead 数据页：build 变了，或今天还没全量跑过（拿不到 build 时按「要跑」处理）
            wowhead_due() {
              due "wowhead-$1" && return 0
              [ "$(node scripts/check-wowhead-build.js --edition "$1" 2>> "$LOG")" != "same" ]
            }

            # ---- Forever ----
            # 装备、物品、天赋、传承来自 nether 数据页，是同步的主体。和其它项一样单项软失败（物品库读的是装备数据的
            # 落盘产物，装备失败时用的是现有那份）；四项全部成功才记为今天跑过，有一项失败下一轮四项照跑。
            if wowhead_due forever; then
              BEFORE="$(snap)"
              CORE_OK=true
              step "装备数据" "同步失败（Wowhead 数据页不可用），本次跳过，沿用现有数据。" \
                node scripts/sync-gear-data.js --icons --report "$REPORT" || CORE_OK=false
              step "物品库" "同步失败（Wowhead 数据页不可用），本次跳过，沿用现有数据。" \
                node scripts/sync-item-data.js --icons --report "$REPORT" || CORE_OK=false
              step "天赋数据" "同步失败（Wowhead 数据页不可用），本次跳过，沿用现有数据。" \
                node scripts/sync-talent-data.js --report "$REPORT" || CORE_OK=false
              step "传承数据" "同步失败（Wowhead 数据页不可用），本次跳过，沿用现有数据。" \
                node scripts/sync-legacy-data.js --report "$REPORT" || CORE_OK=false
              [ "$CORE_OK" = true ] && done_mark wowhead-forever "$BEFORE"
            else
              skipped "装备 / 物品 / 天赋 / 传承" "客户端 build 没变、今天已全量同步过，本次跳过。"
            fi
            # 下面几项来自 www.wowhead.com（前面挂着 CloudFront）、wago.tools 或 GitHub，被拦时只跳过这一项。
            step "专业数据" "同步失败（技能页可能被 CloudFront 拦截），本次跳过，沿用现有数据。" \
              node scripts/sync-profession-data.js --icons --report "$REPORT"
            # 每次 403 退避要等三分多钟，单独限时 45 分钟（脚本最后才写盘，超时不会留半截数据）。每天跑一次（失败不记，下次再试）。
            if due zone-loot-forever; then
              BEFORE="$(snap)"
              step "副本掉落" "同步失败或超时（地区 / NPC 页可能被 CloudFront 拦截），本次跳过，沿用现有数据。" \
                timeout 45m node scripts/sync-zone-loot.js --assets --classic-cache .cache/zone-loot-classic --report "$REPORT" \
                && done_mark zone-loot-forever "$BEFORE"
            else
              skipped "副本掉落" "今天已同步过，本次跳过。"
            fi
            step "职业改动" "同步失败（改动页可能被 CloudFront 拦截），本次跳过，沿用现有数据。" \
              node scripts/sync-class-changes.js --icons --report "$REPORT"
            # 补丁说明要读职业改动的产物（各职业的法术编号与天赋系名），所以排在它后面。增量与不传 --force 的原因见文件头。
            step "补丁说明" "同步失败（wago.tools 或 Raidbots 热修缓存不可用），本次跳过，沿用现有数据。" \
              node scripts/sync-patch-notes.js --report "$REPORT"
            # 上游指纹（cMaNGOS 文件的 ETag + wago build）与上次相同时脚本自己跳过。
            # shellcheck disable=SC2086
            step "任务数据" "同步失败（cMaNGOS 或 wago 下载失败），本次跳过，沿用现有数据。" \
              node scripts/sync-quest-data.js $FORCE --report "$REPORT"
            # 阵营声望与坐骑（只有 Forever）：声望每天抓 60 个阵营页，坐骑平时只抓 1 个列表页（物品页增量，见下）。
            # 和副本掉落一样每天最多跑一次，被拦只跳过本项。脚本最终失败直接报错、不写半截数据。
            if due factions-forever; then
              BEFORE="$(snap)"
              step "阵营声望（Forever）" "同步失败（阵营页可能被 CloudFront 拦截），本次跳过，沿用现有数据。" \
                node scripts/sync-forever-factions.js --icons --report "$REPORT" \
                && done_mark factions-forever "$BEFORE"
            else
              skipped "阵营声望（Forever）" "今天已同步过，本次跳过。"
            fi
            # 坐骑默认增量：平时只抓列表页，物品页只抓新坐骑与列表信息变了的；每月 1 号（当天第一轮）或手动 full 时全量校准。
            if due mounts-forever; then
              BEFORE="$(snap)"
              MOUNT_FULL=""
              { [ "$FULL" = "true" ] || [ "$(date -u +%d)" = "01" ]; } && MOUNT_FULL="--full"
              # shellcheck disable=SC2086
              step "坐骑数据" "同步失败（物品页可能被 CloudFront 拦截），本次跳过，沿用现有数据。" \
                node scripts/sync-mount-data.js $MOUNT_FULL --icons --report "$REPORT" \
                && done_mark mounts-forever "$BEFORE"
            else
              skipped "坐骑数据" "今天已同步过，本次跳过。"
            fi

            # ---- 经典 60 ----
            # 上游是 Wowhead 的 classic 环境（混着赛季服内容，脚本按版本号 / 1.14 客户端过滤），没有传承、热修、职业改动。
            # 只在版本号变了时跑（见文件头）；拿不到版本号（被拦）时按「要跑」处理。每一项都软失败。
            CLASSIC="$(node scripts/check-wowhead-build.js --edition classic --with-wago 2>> "$LOG")"
            if [ "$FULL" = "true" ] || [ "$CLASSIC" != "same" ]; then
              echo "经典 60 上游版本：${CLASSIC}"
              CLASSIC_OK=true
              step "装备数据（经典 60）" "同步失败，本次跳过，沿用现有数据。" \
                node scripts/sync-gear-data.js --edition classic --icons --report "$REPORT" || CLASSIC_OK=false
              # 物品库：CI 没有 tooltip 缓存，只补上次产物里还没有详情的物品。
              step "物品库（经典 60）" "同步失败，本次跳过，沿用现有数据。" \
                node scripts/sync-item-data.js --edition classic --icons --report "$REPORT" || CLASSIC_OK=false
              step "天赋数据（经典 60）" "同步失败（数据页被拦或 wago 不可用），本次跳过，沿用现有数据。" \
                node scripts/sync-talent-data.js --edition classic --report "$REPORT" || CLASSIC_OK=false
              step "专业数据（经典 60）" "同步失败（技能页可能被 CloudFront 拦截），本次跳过，沿用现有数据。" \
                node scripts/sync-profession-data.js --edition classic --icons --report "$REPORT" || CLASSIC_OK=false
              # 经典副本掉落的页面与上面 Forever 用来补齐的经典旧世页面同名，共用按周缓存；单独限时 20 分钟。
              step "副本掉落（经典 60）" "同步失败或超时（地区 / NPC 页可能被 CloudFront 拦截），本次跳过，沿用现有数据。" \
                timeout 20m node scripts/sync-zone-loot.js --edition classic --assets --classic-cache .cache/zone-loot-classic --report "$REPORT" \
                || CLASSIC_OK=false
              # 五项都成功才记下这次的版本号（data/classic/upstream.json）；有一项失败就不记，下一轮整组重试。
              if [ "$CLASSIC_OK" = true ]; then
                step "经典 60 版本记录" "上游版本号读取失败，本次不更新记录，下一轮重试。" \
                  node scripts/check-wowhead-build.js --edition classic --stamp
              fi
            else
              skipped "经典 60" "Wowhead 经典数据版本与 wago 经典客户端 build 都没变，本次跳过。"
            fi

            # ---- 两个版本共用 ----
            # 首领在副本地图上的位置：两个版本的副本掉落合并起来对位，所以放在最后。build、首领与地图都没变时脚本自己跳过。
            # shellcheck disable=SC2086
            step "首领坐标" "同步失败（wago.tools 不可用），本次跳过，沿用现有坐标。" \
              node scripts/sync-boss-positions.js $FORCE --report "$REPORT"
          fi
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "### 上游数据有变化" >> "$GITHUB_STEP_SUMMARY"
            echo "上游数据有变化"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "### 上游数据没有变化" >> "$GITHUB_STEP_SUMMARY"
            echo "上游数据没有变化"
          fi
          if [ -n "$FAILED" ]; then
            echo "- 失败并跳过：${FAILED}（沿用现有数据，日志末尾已推飞书）" >> "$GITHUB_STEP_SUMMARY"
            echo "本轮失败并跳过：${FAILED}"
          fi
          exit 0

      # 本周第一次全量同步拉到的经典旧世页面存起来（脚本中途失败也存：已拉到的页面都是完整的，缺的下次补拉）。
      - name: Save classic page cache
        if: >-
          always() && env.HOTFIX_ONLY != 'true' &&
          steps.classic_cache.outputs.cache-hit != 'true' && hashFiles('.cache/zone-loot-classic/**') != ''
        uses: actions/cache/save@v4
        with:
          path: .cache/zone-loot-classic
          key: ${{ steps.week.outputs.key }}

      - name: Gate - changed paths
        id: gate
        if: steps.pull.outputs.changed == 'true'
        run: |
          # 只允许动同步脚本的产物：两个版本的数据目录（data/<版本>、src/data/<版本>）与共用的图标、副本素材、
          # 首领坐标、任务数据。私有仓库加了新的数据目录要同时改这里。输出含文件名，全部进 gate.log
          bash -euo pipefail > "$PRIV/gate.log" 2>&1 <<'GATE' || { echo "::error::改动超出数据目录，不开 PR（原因见加密 artifact 里的 gate.log）"; exit 1; }
          BAD=$(git -c core.quotepath=off status --porcelain --untracked-files=all \
            | cut -c4- \
            | grep -vE '^(data/(forever|classic|dungeons|quests)/|public/icons/|public/assets/dungeons/|src/data/(forever|classic)/)' || true)
          if [ -n "$BAD" ]; then
            echo "同步改动了数据目录以外的文件："
            echo "$BAD"
            exit 1
          fi
          git -c core.quotepath=off status --porcelain --untracked-files=all | wc -l
          GATE
          echo "闸门通过"

      - name: Push branch and open PR
        id: pr
        if: steps.pull.outputs.changed == 'true'
        env:
          TOKEN: ${{ secrets.CONTENT_REPO_TOKEN }}
          GH_TOKEN: ${{ secrets.CONTENT_REPO_TOKEN }}
        run: |
          set -euo pipefail
          DAY=$(date -u +%F)
          if [ "$HOTFIX_ONLY" = "true" ]; then WHAT="服务端热修物品数值（Raidbots 缓存）"; else WHAT="上游装备 / 天赋 / 传承等数据（Forever + 经典 60）"; fi
          TITLE="chore(data): 同步${WHAT}（${DAY}）"
          if [ "$RELEASE" = "true" ]; then
            NEXT="私有仓库的 CI 在本 PR 上通过后自动合并，并发布新版本、部署上线；CI 没过就停在这里等人处理。"
          else
            NEXT="本次手动运行关闭了自动发布，请人工合并。"
          fi
          BODY="$PRIV/pr-body.md"
          {
            echo "定时数据同步自动生成：上游数据有更新。"
            echo
            echo "$NEXT"
            echo
            echo "## 变更"
            echo
            cat "$PRIV/report.md"
            echo
            echo "运行记录（日志不含数据；完整日志在加密 artifact 里）：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > "$BODY"
          {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git checkout -B "$SYNC_BRANCH"
            git add -A
            git commit -m "chore(data): 同步上游装备 / 天赋 / 传承 / 专业 / 副本掉落 / 职业改动 / 补丁说明 / 任务数据（Forever + 经典 60）"
            git push --force "https://x-access-token:${TOKEN}@github.com/${CONTENT_REPO}.git" "HEAD:refs/heads/${SYNC_BRANCH}"
          } > "$PRIV/push.log" 2>&1 || { echo "::error::推送 ${SYNC_BRANCH} 失败（详情在加密 artifact 里）"; exit 1; }
          PR=$(gh pr list --repo "$CONTENT_REPO" --head "$SYNC_BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$PR" ]; then
            gh pr edit "$PR" --repo "$CONTENT_REPO" --title "$TITLE" --body-file "$BODY" > /dev/null 2>> "$PRIV/pr.err"
            echo "已更新 PR"
          else
            URL=$(gh pr create --repo "$CONTENT_REPO" --base main --head "$SYNC_BRANCH" \
                    --title "$TITLE" --body-file "$BODY" 2>> "$PRIV/pr.err")
            PR="${URL##*/}"
            gh pr edit "$PR" --repo "$CONTENT_REPO" --add-label data-sync > /dev/null 2>> "$PRIV/pr.err" || true
            echo "已开 PR"
          fi
          echo "number=$PR" >> "$GITHUB_OUTPUT"
          echo "$PR" > "$PRIV/pr-number"   # 飞书卡片的 PR 按钮用；不经 env 传，免得进公开日志
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Wait for CI and merge
        id: merge
        if: steps.pr.outputs.number != '' && env.RELEASE == 'true'
        env:
          GH_TOKEN: ${{ secrets.CONTENT_REPO_TOKEN }}
          PR: ${{ steps.pr.outputs.number }}
          SHA: ${{ steps.pr.outputs.sha }}
        run: |
          set -euo pipefail
          # 按 head SHA 找私有仓库 ci.yml 的 pull_request 运行（排队时 PR 上还没有检查，不能看 gh pr checks）。
          RUN_ID=""
          for i in $(seq 1 30); do
            RUN_ID="$(gh run list --repo "$CONTENT_REPO" --workflow ci.yml --commit "$SHA" --event pull_request \
              --json databaseId --jq '.[0].databaseId // empty' 2>> "$PRIV/merge.log" || true)"
            [ -n "$RUN_ID" ] && break
            sleep 10
          done
          if [ -z "$RUN_ID" ]; then
            echo "::error::五分钟内私有仓库没有在 PR 上跑 CI，不合并。检查 ci.yml 的 pull_request 触发条件。"
            exit 1
          fi
          echo "等待私有仓库 CI…"
          if ! gh run watch "$RUN_ID" --repo "$CONTENT_REPO" --exit-status --interval 30 > "$PRIV/ci-watch.log" 2>&1; then
            # 失败步骤的日志（「job<TAB>step<TAB>时间戳 内容」→「step | 内容」），只进 $PRIV 和飞书
            gh run view "$RUN_ID" --repo "$CONTENT_REPO" --log-failed 2>&1 \
              | sed -E $'s/^[^\t]*\t([^\t]*)\t[0-9T:.-]+Z ?/\\1 | /' > "$PRIV/ci-failed.log"
            echo "::error::私有仓库 CI 未通过，PR 留着人工处理，不发版"
            exit 1
          fi
          echo "CI 通过"
          gh pr merge "$PR" --repo "$CONTENT_REPO" --squash --delete-branch \
            --subject "chore(data): 同步上游数据（$(date -u +%F)）" >> "$PRIV/merge.log" 2>&1 \
            || { echo "::error::合并失败（多半是 main 已前进产生冲突），PR 留着人工处理"; exit 1; }
          echo "已合并"
          echo "merged=true" >> "$GITHUB_OUTPUT"

      # 有改动的那几项：改动已经合并进私有仓库 main，才记为今天跑过（没合并时不记，下次重跑，改动继续留在 PR 里）。
      # 不论成败都另存一份标记（新 key），下次运行从 restore-keys 取当天最近的这份。标记只有项名，不含数据。
      # 模块页头的「核对于 …」：本轮跑成功的同步项与完成时间推给站点（私有仓库 scripts/report-sync-status.js →
      # 站点 POST /api/sync-status）。只在站点数据确实跟上了上游时报：本轮没有改动，或改动已经合并 ——
      # 拉到了新数据却没合并（CI 没过 / 手动运行不自动发布）时站点上还是旧数据，不能算核对过。
      # 没配 vars.SITE_URL / secrets.SYNC_STATUS_TOKEN 时脚本只打 warning；上报失败不影响同步。日志只有数据源名。
      - name: Report sync status
        if: >-
          always() && steps.pull.outcome == 'success' &&
          (steps.pull.outputs.changed != 'true' || steps.merge.outputs.merged == 'true')
        continue-on-error: true
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          SYNC_STATUS_TOKEN: ${{ secrets.SYNC_STATUS_TOKEN }}
        run: |
          [ -f scripts/report-sync-status.js ] || { echo "私有仓库还没有 report-sync-status.js，跳过"; exit 0; }
          node scripts/report-sync-status.js "$PRIV/timeline.tsv"

      - name: Record sync marks
        if: always() && env.HOTFIX_ONLY != 'true'
        run: |
          mkdir -p .cache/sync-marks
          PENDING="${PRIV:-/nonexistent}/pending-marks"
          if [ "${{ steps.merge.outputs.merged }}" = "true" ] && [ -s "$PENDING" ]; then
            while read -r m; do touch ".cache/sync-marks/$m"; done < "$PENDING"
          fi
          ls .cache/sync-marks

      - name: Save sync marks
        if: always() && env.HOTFIX_ONLY != 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/sync-marks
          key: sync-marks-${{ steps.week.outputs.day }}-${{ github.run_id }}

      # 推飞书卡片（secrets.FEISHU_WEBHOOK，开了签名校验再配 FEISHU_SIGN_SECRET）。消息内容只发飞书，不进公开日志：
      #   ❌ 流程中断（拉数据异常退出 / 闸门 / 推送开 PR / 等 CI 合并）：卡在哪，外加相关日志末尾；CI 没过附 CI 报错
      #   ⚠️ 有同步项失败（已跳过、其余照常）：每项的原因、用时和日志末尾 40 行，外加本轮的数据变更
      #   📦 有更新但没自动合并（手动运行关了发版）：变更摘要 + PR
      #   有更新并已合并：这里不推，发版部署完由私有仓库 deploy.yml 推「✅ 数据更新已上线」（带变更摘要），一次更新一条
      #   没变化、没失败：不推（每两小时一轮，太吵）；仓库变量 FEISHU_NOTIFY_ALL=true 时也推一条 ✅
      # 卡片由私有仓库的 scripts/notify-feishu.js 拼；checkout 失败没有脚本时退回 curl 发一行纯文本。
      # 推送失败只记警告，不影响本次运行结果。
      - name: Notify Feishu
        if: always()
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SIGN_SECRET: ${{ secrets.FEISHU_SIGN_SECRET }}
          NOTIFY_ALL: ${{ vars.FEISHU_NOTIFY_ALL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_NO: ${{ github.run_number }}
          JOB_STATUS: ${{ job.status }}
          PULL: ${{ steps.pull.outcome }}
          CHANGED: ${{ steps.pull.outputs.changed }}
          GATE: ${{ steps.gate.outcome }}
          PR_STEP: ${{ steps.pr.outcome }}
          MERGE: ${{ steps.merge.outcome }}
          MERGED: ${{ steps.merge.outputs.merged }}
        run: |
          set +e -uo pipefail   # 推送失败（curl 出错等）也不能让这一步失败
          if [ -z "$FEISHU_WEBHOOK" ]; then
            echo "::warning::未配置 FEISHU_WEBHOOK，本轮结果没推飞书"
            exit 0
          fi
          PRIV="${PRIV:-${RUNNER_TEMP}/private}"
          FAILS="$PRIV/failures"
          N="$PRIV/notify"
          mkdir -p "$FAILS" "$N"
          # 流程步骤失败：标题 + 相关日志末尾（文件名以 z 开头，排在同步项后面）
          flow_fail() {
            local key="$1" title="$2"; shift 2
            { echo "✗ $title"; echo "--- 日志末尾 ---"
              for f in "$@"; do [ -s "$f" ] && tail -n 40 "$f"; done
            } > "$FAILS/z-$key.txt"
          }
          [ "$PULL" = failure ] && flow_fail pull "拉取上游数据：步骤异常退出" "$PRIV/sync.log"
          [ "$GATE" = failure ] && flow_fail gate "闸门：改动超出数据目录，没开 PR" "$PRIV/gate.log"
          [ "$PR_STEP" = failure ] && flow_fail pr "推送 bot/data-sync / 开 PR 失败" "$PRIV/push.log" "$PRIV/pr.err"
          if [ "$MERGE" = failure ]; then
            if [ -s "$PRIV/ci-failed.log" ]; then
              flow_fail merge "私有仓库 CI 没过，PR 留着人工处理，没发版" "$PRIV/ci-failed.log"
            else
              flow_fail merge "等 CI / 合并失败，PR 留着人工处理，没发版" "$PRIV/ci-watch.log" "$PRIV/merge.log"
            fi
          fi
          shopt -s nullglob
          files=("$FAILS"/*.txt)
          if [ ${#files[@]} -eq 0 ] && [ "$JOB_STATUS" = failure ]; then
            flow_fail other "其他步骤失败（配置 / checkout / 缓存），见运行记录"
            files=("$FAILS"/*.txt)
          fi

          COLOR=""
          if [ "$JOB_STATUS" = cancelled ]; then
            TITLE="⏹ 数据同步 #${RUN_NO}：被取消（手动取消或超时）"; COLOR=grey
          elif [ "$JOB_STATUS" != success ]; then
            TITLE="❌ 数据同步 #${RUN_NO}：流程中断"
          elif [ ${#files[@]} -gt 0 ]; then
            TITLE="⚠️ 数据同步 #${RUN_NO}：${#files[@]} 项失败，已跳过，其余照常"
          elif [ "$CHANGED" = true ] && [ "$MERGED" != true ]; then
            TITLE="📦 数据同步 #${RUN_NO}：有更新，PR 待合并"
          elif [ "$NOTIFY_ALL" = true ]; then
            if [ "$CHANGED" = true ]; then TITLE="✅ 数据同步 #${RUN_NO}：有更新，已合并发版"; else TITLE="✅ 数据同步 #${RUN_NO}：上游无变化"; fi
          else
            echo "没有失败项、没有待处理的更新，不推送（更新上线后由私有仓库 deploy.yml 推送）"
            exit 0
          fi

          # 开头一段：哪种运行、有没有变化、接下来怎样、用时
          T=""; [ -s "$PRIV/t0" ] && T=$(( $(date +%s) - $(cat "$PRIV/t0") ))
          RAN=$(tail -n +2 "$PRIV/timeline.tsv" 2>/dev/null | wc -l | tr -d ' ')
          {
            if [ "$HOTFIX_ONLY" = true ]; then printf '**只同步服务端热修**'; else printf '**全部上游**'; fi
            [ "$FULL" = true ] && printf '（手动全量）'
            printf ' · 跑了 %s 项' "$RAN"
            [ -n "$T" ] && printf ' · 用时 %dm%02ds' $((T / 60)) $((T % 60))
            echo
            if [ "$CHANGED" = true ]; then
              if [ "$MERGED" = true ]; then echo "数据有更新，已合并，接着发版部署（上线后另有通知）"
              elif [ "$PR_STEP" = success ] && [ "$RELEASE" != true ]; then echo "数据有更新，本次手动运行关了自动发版，PR 等人工合并"
              elif [ "$PR_STEP" = success ]; then echo "数据有更新，PR 已开但没合并"
              else echo "数据有更新，但没开成 PR"
              fi
            elif [ "$PULL" = success ]; then
              echo "上游数据没有变化"
            fi
          } > "$N/summary.md"

          ARGS=(--title "$TITLE" --md "$N/summary.md")
          [ -n "$COLOR" ] && ARGS+=(--color "$COLOR")
          for f in "${files[@]}"; do ARGS+=(--fail "$f"); done
          [ "$CHANGED" = true ] && ARGS+=(--report "$PRIV/report.md")
          ARGS+=(--button "运行记录|${RUN_URL}")
          [ -s "$PRIV/pr-number" ] && ARGS+=(--button "PR|https://github.com/${CONTENT_REPO}/pull/$(cat "$PRIV/pr-number")")

          if [ -f scripts/notify-feishu.js ]; then
            node scripts/notify-feishu.js "${ARGS[@]}" > "$N/send.log" 2>&1
            RC=$?
            cat "$N/send.log"   # 只有「已推送 / 拒收 + 返回码」，不含消息内容
          else
            # checkout 都没成功：没有脚本，发一行纯文本
            jq -n --arg t "$TITLE"$'\n'"$RUN_URL" '{msg_type: "text", content: {text: $t}}' > "$N/msg.json"
            if [ -n "$FEISHU_SIGN_SECRET" ]; then
              TS="$(date +%s)"
              SIGN="$(printf '' | openssl dgst -sha256 -hmac "$(printf '%s\n%s' "$TS" "$FEISHU_SIGN_SECRET")" -binary | base64)"
              jq --arg ts "$TS" --arg s "$SIGN" '. + {timestamp: $ts, sign: $s}' "$N/msg.json" > "$N/msg.signed" && mv "$N/msg.signed" "$N/msg.json"
            fi
            curl -sS -m 20 -H 'Content-Type: application/json' --data-binary @"$N/msg.json" "$FEISHU_WEBHOOK" > "$N/send.log" 2>&1
            grep -qE '"(code|StatusCode)":0' "$N/send.log"; RC=$?
          fi
          [ "$RC" -eq 0 ] || echo "::warning::飞书推送失败（19021 = 签名不对或没配 FEISHU_SIGN_SECRET，19024 = 缺机器人设的关键词）"

      - name: Encrypt logs
        if: always()
        env:
          PASS: ${{ secrets.ARTIFACT_PASSPHRASE }}
        run: |
          set -uo pipefail
          if [ -z "${PASS}" ]; then
            echo "::warning::未配置 ARTIFACT_PASSPHRASE，跳过 artifact（公开仓库不上传明文）"
            exit 0
          fi
          [ -d "${PRIV:-}" ] || exit 0
          mkdir -p "${RUNNER_TEMP}/out"
          tar czf - -C "$PRIV" . 2>/dev/null \
            | openssl enc -aes-256-cbc -md sha256 -pbkdf2 -iter 200000 -salt -pass env:PASS \
              -out "${RUNNER_TEMP}/out/run-${{ github.run_number }}.tar.gz.enc"
          echo "已加密：$(du -h "${RUNNER_TEMP}/out/run-${{ github.run_number }}.tar.gz.enc" | cut -f1)"

      - name: Upload encrypted artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-run-${{ github.run_number }}
          path: ${{ runner.temp }}/out/
          if-no-files-found: ignore
          retention-days: 14

  release:
    needs: sync
    if: needs.sync.outputs.merged == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout content repo
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.CONTENT_REPO }}
          token: ${{ secrets.CONTENT_REPO_TOKEN }}
          ref: main
          fetch-depth: 0 # standard-version 要读历史提交与已有 tag
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bump version, changelog and tag
        env:
          TOKEN: ${{ secrets.CONTENT_REPO_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          set -Eeuo pipefail
          LOG="${RUNNER_TEMP}/release.log"
          # 输出只进 release.log（失败时推飞书）。不能写成 { … } > log || { … }：|| 左边的命令里 set -e 不生效，
          # standard-version 打 tag 失败（同名 tag 已存在）也会接着推 main，最后照样报「已发版」。
          exec 3>&1 > "$LOG" 2>&1
          trap 'echo "::error::发版失败" >&3' ERR
          pnpm install --frozen-lockfile
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 站点上的核对时间取一份烤进 src/data/updates.json（stamp-updates.js 读 SYNC_CHECKS_FILE）：重新部署后站点的
          # 实时记录可能没了，至少还有发版时这一份。取不到不挡发版（沿用上一份）。
          if [ -n "${SITE_URL:-}" ] && curl -sf --max-time 20 "${SITE_URL%/}/api/sync-status" -o "${RUNNER_TEMP}/sync-checks.json"; then
            export SYNC_CHECKS_FILE="${RUNNER_TEMP}/sync-checks.json"
          fi
          # 只升补丁号；版本提交、CHANGELOG、release-v* tag 由 standard-version 生成（配置见私有仓库 package.json）。
          pnpm exec standard-version --release-as patch
          TAG="release-v$(node -p 'require("./package.json").version')"
          # PAT 推的 tag 会触发私有仓库 deploy.yml 的 push tags（GITHUB_TOKEN 推的不会）。
          # tag 显式推，且与 main 原子推送：--follow-tags 碰到远端已有同名 tag 会静默跳过，main 升了版本却不部署。
          git push --atomic "https://x-access-token:${TOKEN}@github.com/${CONTENT_REPO}.git" HEAD:main "refs/tags/${TAG}"
          exec >&3 2>&1
          echo "### 已发版：${TAG}，私有仓库 deploy.yml 接着部署" >> "$GITHUB_STEP_SUMMARY"
          echo "已发版"

      # 发版失败推飞书（数据已合并进 main，只是没升版本 / 没部署）。发版成功不在这里推：
      # tag 触发私有仓库 deploy.yml，部署完由它推「✅ 数据更新已上线」或「❌ 网站部署失败」。
      - name: Notify Feishu on failure
        if: failure()
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SIGN_SECRET: ${{ secrets.FEISHU_SIGN_SECRET }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_NO: ${{ github.run_number }}
        run: |
          set +e -uo pipefail
          [ -n "$FEISHU_WEBHOOK" ] || { echo "::warning::未配置 FEISHU_WEBHOOK，发版失败没推飞书"; exit 0; }
          N="${RUNNER_TEMP}/feishu"
          mkdir -p "$N"
          echo "数据已合并进 main，但没升版本、没部署。修好后在私有仓库手动发版（standard-version + 推 release-v* tag）。" > "$N/summary.md"
          { echo "✗ 升版本 / 推 tag 失败"; tail -n 40 "${RUNNER_TEMP}/release.log" 2>/dev/null; } > "$N/fail.txt"
          node scripts/notify-feishu.js --title "❌ 数据同步 #${RUN_NO}：数据已合并，发版失败" \
            --md "$N/summary.md" --fail "$N/fail.txt" --button "运行记录|${RUN_URL}" \
            || echo "::warning::飞书推送失败（checkout 失败时没有脚本，见运行记录）"

  keepalive:
    if: github.event.schedule == '17 3 1 * *'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Commit keepalive
        run: |
          date -u +%FT%TZ > .keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          git commit -q -m "chore: keepalive"
          git push -q
